<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--surface:#f5f7fb;--ink:#101826;--muted:#58657c;--line:#e1e7f0;--accent:#c9186a;--accent-ink:#fff;--g:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);--gv:linear-gradient(180deg,#f9ce34,#ee2a7b,#6228d7);--gb:linear-gradient(45deg,#ee2a7b,#6228d7);--chip:#eef2f9;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 var(--body);-webkit-text-size-adjust:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.hero{background:radial-gradient(60% 38% at 12% 0%,rgba(249,206,52,.28),transparent 70%),radial-gradient(55% 38% at 92% 8%,rgba(98,40,215,.16),transparent 70%),radial-gradient(70% 38% at 50% 100%,rgba(238,42,123,.14),transparent 70%);min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:0 16px 40px;overflow:hidden}
.strap{width:30px;height:clamp(50px,10vh,100px);background:var(--gv);position:relative;box-shadow:inset 6px 0 0 rgba(255,255,255,.22),inset -6px 0 0 rgba(0,0,0,.1)}
.clip{width:18px;height:26px;border:3px solid #aab6c8;border-radius:5px 5px 9px 9px;margin-top:-6px;background:#eef2f8;position:relative;z-index:2}
.stage{perspective:1400px;-webkit-perspective:1400px;margin-top:-10px}
.card{position:relative;width:min(330px,86vw);aspect-ratio:330/610;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.75,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;overflow:hidden;color:var(--ink);background:#fff;border:1px solid var(--line);box-shadow:0 18px 40px rgba(16,24,38,.16),0 2px 6px rgba(16,24,38,.06);backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:clamp(16px,5.5vw,22px);display:flex;flex-direction:column;transition:visibility 0s linear .4s}
.face::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,#f9ce34,#ee2a7b,#6228d7)}
.front{transform:rotateY(0deg) translateZ(1px)}
.back{transform:rotateY(180deg) translateZ(1px)}
.card.flipped .front{visibility:hidden}
.card:not(.flipped) .back{visibility:hidden}
.slot{width:54px;height:10px;border-radius:6px;background:#dfe5ee;margin:6px auto 12px;box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.org{font:600 .8rem/1.2 var(--body);color:var(--muted);display:flex;justify-content:space-between;margin-bottom:14px}
.ring{width:min(190px,52vw);aspect-ratio:1;margin:0 auto;border-radius:50%;padding:5px;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
.ring i{display:block;width:100%;height:100%;border-radius:50%;padding:5px;background:#fff}
.photo{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 20%;display:block;background:#8796ab}
.name{font:800 clamp(1.55rem,7vw,1.95rem)/1.05 var(--display);margin:16px 0 4px;letter-spacing:-.01em;text-align:center}
.role{font:600 .95rem/1.3 var(--body);color:var(--accent);background:var(--gb);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:0 0 10px;text-align:center}
.bio{font-size:.86rem;line-height:1.55;color:var(--muted);margin:0;text-align:center}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.74rem;color:var(--muted)}
.bars{flex:1;height:24px;border-radius:3px;background:repeating-linear-gradient(90deg,#1b2638 0 2px,transparent 2px 5px,#1b2638 5px 6px,transparent 6px 10px,#1b2638 10px 13px,transparent 13px 15px);opacity:.55}
.back h2{font:800 1.5rem/1.1 var(--display);margin:2px 0 12px}
.rows{display:grid;gap:9px;margin:0;padding:0;list-style:none;font-size:.85rem}
.rows small{display:block;color:var(--muted);font-size:.74rem;line-height:1.3}
.rows a,.rows span{word-break:break-word;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:2px solid #ee2a7b}
.rows span{border:0}
.qrbox{display:flex;align-items:center;gap:12px;margin:12px 0 10px;padding:10px;border:2px solid transparent;border-radius:14px;background:linear-gradient(#fff,#fff) padding-box,var(--g) border-box}
.qr{width:96px;height:96px;flex:none;display:grid;place-items:center}
.qr img,.qr canvas{width:96px!important;height:96px!important;display:block}
.qrbox p{margin:0;font-size:.8rem;line-height:1.4;color:var(--muted)}
.hint{margin:22px 0 0;color:var(--muted);font-size:.9rem;text-align:center}

main{max-width:880px;margin:0 auto;padding:24px 20px 56px}
section{padding:44px 0;position:relative}
section::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;border-radius:3px;background:var(--g)}
h2.t{font:800 clamp(1.6rem,5vw,2.2rem)/1.1 var(--display);margin:0 0 22px;letter-spacing:-.01em}
h2.t::after{content:"";display:block;width:56px;height:5px;border-radius:5px;background:var(--g);margin-top:10px}
p{margin:0 0 14px;max-width:62ch}
.muted{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:20px}
.fact{border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--g) border-box;border-radius:12px;padding:14px 16px}
.fact b{display:block;font-family:var(--display);font-size:1.02rem}
.fact span{color:var(--muted);font-size:.9rem}
.group{margin:0 0 20px}
.group h3{margin:0 0 8px;font:600 1rem/1.3 var(--body);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;font-weight:600;font-size:.92rem;border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--g) border-box}
.proj{display:grid;gap:10px;position:relative;overflow:hidden;background:#fff;border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--g) border-box;border-radius:16px;padding:20px 20px 20px 28px}
.proj::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--gv)}
.proj h3{margin:0;font:800 1.3rem/1.2 var(--display)}
.proj p{margin:0}
.btn{display:inline-block;width:max-content;max-width:100%;background:var(--gb);color:var(--accent-ink);padding:10px 18px;border-radius:10px;font-weight:600;text-decoration:none}
.steps{list-style:none;margin:0;padding:0 0 0 22px;border-left:4px solid;border-image:var(--gv) 1}
.steps li{position:relative;padding:0 0 18px 18px}
.steps li::before{content:"";position:absolute;left:-32px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--g);border:3px solid var(--bg)}
.steps b{font-family:var(--display);display:block}
.steps span{color:var(--muted)}
blockquote{margin:0 0 16px;background:var(--g);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#c9186a;font:600 clamp(1.15rem,3.6vw,1.45rem)/1.4 var(--display);max-width:34ch}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.links a{display:block;border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--g) border-box;border-radius:12px;padding:14px 16px;text-decoration:none;word-break:break-word}
.links a:hover{background:linear-gradient(var(--chip),var(--chip)) padding-box,var(--g) border-box}
.links b{display:block;font-family:var(--display)}
.links span{color:var(--muted);font-size:.9rem}

.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn.alt{background:linear-gradient(#fff,#fff) padding-box,var(--g) border-box;border:1.5px solid transparent;color:var(--ink)}
.demo{border:1.5px solid transparent;border-radius:12px;overflow:hidden;background:linear-gradient(#fff,#fff) padding-box,var(--g) border-box}
.demo .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);font-size:.78rem;color:var(--muted)}
.demo .dots{display:flex;gap:5px;flex:none}
.demo .dots i{width:9px;height:9px;border-radius:50%;background:#f9ce34}
.demo .dots i:nth-child(2){background:#ee2a7b}
.demo .dots i:nth-child(3){background:#6228d7}
.demo .url{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.demo iframe{display:block;width:100%;height:clamp(380px,62vh,520px);border:0;background:#fff}
.demo .ph{display:grid;justify-items:center;gap:12px;padding:30px 16px;text-align:center;color:var(--muted);font-size:.92rem}
.demo .ph .btn{border:0;font:600 1rem var(--body);cursor:pointer}
.demo p{margin:0;padding:8px 12px;font-size:.82rem;color:var(--muted)}
footer{position:relative;padding-top:28px!important;text-align:center;color:var(--muted);padding:0 20px 36px;font-size:.9rem}
footer::before{content:"";position:absolute;top:0;left:20px;right:20px;height:4px;border-radius:4px;background:var(--g)}
@media (min-width:760px){.hero{padding-bottom:64px}main{padding-top:40px}}
@media (min-width:900px),(orientation:landscape) and (max-height:600px){
.strap{height:clamp(36px,6vh,64px)}
.card{width:min(800px,88vw);aspect-ratio:800/450}
.face{padding:26px 36px}
.slot{grid-area:slot;margin:0 auto 8px}
.front{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr auto auto 1fr auto;grid-template-areas:"slot slot" "ring org" "ring name" "ring role" "ring bio" "foot foot";column-gap:40px;align-items:center}
.front .ring{grid-area:ring;width:250px;margin:0;align-self:center}
.front .org{grid-area:org;align-self:end;margin:0 0 10px;font-size:.92rem}
.front .name{grid-area:name;text-align:left;font-size:2.7rem;margin:0 0 6px}
.front .role{grid-area:role;text-align:left;font-size:1.2rem;margin:0 0 10px}
.front .bio{grid-area:bio;text-align:left;font-size:1rem;align-self:start;max-width:46ch}
.face .foot{grid-area:foot;align-self:end}
.back{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto 1fr auto;grid-template-areas:"slot slot" "h2 qr" "rows qr" "foot foot";column-gap:36px}
.back h2{grid-area:h2;font-size:1.9rem;margin:0 0 14px}
.back .rows{grid-area:rows;grid-template-columns:1fr 1fr;gap:16px 24px;font-size:.95rem;align-content:start}
.back .qrbox{grid-area:qr;flex-direction:column;align-self:center;margin:0;padding:14px;text-align:center}
.qr{width:160px;height:160px}
.qr img,.qr canvas{width:160px!important;height:160px!important}
.qrbox p{max-width:160px;font-size:.85rem}
.hint{margin-top:26px}
}
@media (orientation:landscape) and (max-height:600px){
.hero{padding:0 12px 12px}
.strap{height:14px}
.clip{height:20px;margin-top:-4px}
.stage{margin-top:-8px}
.card{width:min(800px,92vw,calc((100svh - 64px)*1.7778))}
.face{padding:clamp(10px,3.6svh,26px) clamp(16px,3vw,36px)}
.slot{height:7px;width:44px;margin-bottom:clamp(2px,1svh,8px)}
.front{column-gap:clamp(16px,3vw,40px)}
.front .ring{width:min(250px,44svh)}
.front .org{font-size:clamp(.66rem,2.4svh,.92rem);margin-bottom:clamp(2px,1.2svh,10px)}
.front .name{font-size:clamp(1.25rem,7svh,2.7rem);margin-bottom:2px}
.front .role{font-size:clamp(.8rem,3.4svh,1.2rem);margin-bottom:clamp(2px,1.2svh,10px)}
.front .bio{font-size:clamp(.7rem,2.9svh,1rem);line-height:1.4}
.face .foot{font-size:clamp(.6rem,2.2svh,.74rem)}
.bars{height:clamp(14px,4.5svh,24px)}
.back h2{font-size:clamp(1.1rem,5svh,1.9rem);margin-bottom:clamp(4px,1.6svh,14px)}
.back .rows{gap:clamp(5px,2svh,16px) 18px;font-size:clamp(.68rem,2.7svh,.95rem)}
.rows small{font-size:clamp(.58rem,2.1svh,.74rem)}
.back .qrbox{padding:clamp(6px,1.6svh,14px)}
.qr{width:min(160px,26svh);height:min(160px,26svh)}
.qr img,.qr canvas{width:min(160px,26svh)!important;height:min(160px,26svh)!important}
.qrbox p{font-size:clamp(.58rem,2.1svh,.85rem);max-width:min(160px,26svh)}
.hint{display:none}
}
@media (prefers-reduced-motion:reduce){.card,.face{transition:none}}
</style>
</head>
<body>
<header class="hero">
  <div class="strap" aria-hidden="true"></div><div class="clip" aria-hidden="true"></div>
  <div class="stage">
    <div class="card" id="card" role="button" tabindex="0" aria-pressed="false">
      <div class="face front">
        <div class="slot"></div>
        <div class="org"><span id="f-uni"></span><span id="f-city"></span></div>
        <div class="ring"><i><img class="photo" id="f-photo" alt=""></i></div>
        <h1 class="name" id="f-name"></h1>
        <p class="role" id="f-role"></p>
        <p class="bio" id="f-bio"></p>
        <div class="foot"><div class="bars"></div><span>Tap to flip</span></div>
      </div>
      <div class="face back">
        <div class="slot"></div>
        <h2>Contact</h2>
        <ul class="rows" id="b-rows"></ul>
        <div class="qrbox" id="qrbox"><div class="qr" id="qr"></div><p id="qr-cap"></p></div>
        <div class="foot"><div class="bars"></div><span>Tap to flip back</span></div>
      </div>
    </div>
  </div>
  <p class="hint">Tap the card to flip it, then scroll down.</p>
</header>
<main>
  <section id="about"><h2 class="t">About me</h2><div id="s-about"></div><div class="facts" id="s-facts"></div></section>
  <section id="tech"><h2 class="t">Languages and technologies</h2><div id="s-skills"></div></section>
  <section id="projects"><h2 class="t">Projects</h2><div id="s-projects"></div><p class="muted" id="s-pnote" style="margin-top:16px"></p></section>
  <section id="roadmap"><h2 class="t">Software engineering roadmap</h2><ul class="steps" id="s-road"></ul></section>
  <section id="philosophy"><h2 class="t">My philosophy</h2><blockquote id="s-quote"></blockquote><p class="muted" id="s-qnote"></p></section>
  <section id="contact"><h2 class="t">Let’s connect</h2><div class="links" id="s-links"></div></section>
</main>
<footer id="s-footer"></footer>

    var btns=(p.live?'<a class="btn"'+ext(p.live)+">"+esc(p.liveText||"Live demo")+"</a>":"")+(p.link?'<a class="btn alt"'+ext(p.link)+">"+esc(p.linkText||"View code")+"</a>":"");
    var demo=p.live&&/^https:/i.test(p.live)&&D.showPreview!==false?'<div class="demo"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="url">'+esc(p.live)+'</span></div><div class="ph"><span>See this project running right here.</span><button type="button" class="btn" data-src="'+esc(p.live)+'" data-title="Live preview of '+esc(p.title)+'">Run live preview</button></div><p>Preview not loading? Use the Live demo button above.</p></div>':"";
    return '<article class="proj" style="margin-bottom:14px"><h3>'+esc(p.title)+"</h3><p>"+esc(p.description)+'</p><div class="chips">'+chips+'</div><div class="btns">'+btns+"</div>"+demo+"</article>"}).join("");
  $("s-pnote").textContent=D.projectsNote||"";
  $("s-road").innerHTML=(D.roadmap||[]).map(function(r){return "<li><b>"+esc(r.title)+"</b><span>"+esc(r.text)+"</span></li>"}).join("");
  $("s-quote").textContent=D.quote||""; $("s-qnote").textContent=D.quoteNote||"";
  var L=[];
  if(C.linkedin) L.push("<a"+ext(C.linkedin)+"><b>LinkedIn</b><span>Connect with me</span></a>");
  if(C.github) L.push("<a"+ext(C.github)+"><b>GitHub</b><span>See my code</span></a>");
  if(C.email) L.push('<a href="mailto:'+esc(C.email)+'"><b>Email</b><span>'+esc(C.email)+"</span></a>");
  if(C.phone) L.push('<a href="tel:'+esc(String(C.phone).replace(/[^+\d]/g,""))+'"><b>Phone</b><span>'+esc(C.phone)+"</span></a>");
  $("s-links").innerHTML=L.join("");
  $("s-footer").textContent=D.footer||"";

  var qrEl=$("qr");
  if(D.qrText && window.QRCode){
    try{new QRCode(qrEl,{text:D.qrText,width:192,height:192,colorDark:"#101826",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});$("qr-cap").textContent=D.qrCaption||"Scan me"}catch(e){$("qrbox").style.display="none"}
  }else{$("qrbox").style.display="none"}

  $("s-projects").addEventListener("click",function(e){
    var b=e.target.closest("[data-src]"); if(!b) return;
    var f=document.createElement("iframe");
    f.src=b.getAttribute("data-src"); f.title=b.getAttribute("data-title");
    f.setAttribute("sandbox","allow-scripts allow-forms allow-same-origin");
    b.closest(".ph").replaceWith(f);
  });

  var card=$("card");
  function flip(){var on=card.classList.toggle("flipped");card.setAttribute("aria-pressed",on)}
  card.addEventListener("click",function(e){if(e.target.closest("a"))return;flip()});
  card.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target===card){e.preventDefault();flip()}});
})();
</script>
</body>
</html>
